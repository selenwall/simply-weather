<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simply Weather</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__top">
        <h1 class="header__title">Simply Weather</h1>
        <button id="theme-toggle" class="theme-toggle" title="Toggle night mode" aria-label="Toggle night mode" aria-checked="false" role="switch">
          <span class="theme-toggle__icon--light">&#9790;</span>
          <span class="theme-toggle__icon--dark">&#9788;</span>
        </button>
      </div>
      <div class="header__controls">
        <div class="location-bar">
          <button id="geolocate-btn" class="btn btn--icon" title="Use my location">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
            </svg>
          </button>
          <input type="text" id="location-input" class="input" placeholder="Search city or coordinates (lat, lon)..." />
          <button id="search-btn" class="btn btn--primary">Search</button>
        </div>
        <div class="source-selector">
          <label for="data-source">Source:</label>
          <select id="data-source" class="select">
            <option value="open-meteo">Open-Meteo (Global)</option>
            <option value="met-norway">MET Norway / Yr (Global)</option>
            <option value="nws">NWS (US Only)</option>
            <option value="smhi">SMHI (Scandinavia)</option>
          </select>
        </div>
      </div>
      <div id="location-display" class="header__location"></div>
    </header>

    <nav class="tabs">
      <button class="tab tab--active" data-view="current">Current</button>
      <button class="tab" data-view="five-day">5-Day</button>
      <button class="tab" data-view="thirty-day">30-Day</button>
    </nav>

    <main class="main">
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Fetching weather data...</p>
      </div>

      <div id="error" class="error hidden">
        <p id="error-message"></p>
        <button id="retry-btn" class="btn btn--primary">Retry</button>
      </div>

      <section id="view-current" class="view">
        <div class="current-weather">
          <div class="current-weather__main">
            <span id="current-icon" class="weather-icon"></span>
            <span id="current-temp" class="current-weather__temp"></span>
          </div>
          <p id="current-desc" class="current-weather__desc"></p>
          <div class="current-weather__details">
            <div class="detail">
              <span class="detail__label">Feels Like</span>
              <span id="current-feels" class="detail__value"></span>
            </div>
            <div class="detail">
              <span class="detail__label">Humidity</span>
              <span id="current-humidity" class="detail__value"></span>
            </div>
            <div class="detail">
              <span class="detail__label">Wind</span>
              <span id="current-wind" class="detail__value"></span>
            </div>
            <div class="detail">
              <span class="detail__label">Pressure</span>
              <span id="current-pressure" class="detail__value"></span>
            </div>
            <div class="detail">
              <span class="detail__label">UV Index</span>
              <span id="current-uv" class="detail__value"></span>
            </div>
            <div class="detail">
              <span class="detail__label">Visibility</span>
              <span id="current-visibility" class="detail__value"></span>
            </div>
          </div>
          <div class="current-weather__sun">
            <div class="sun-item">
              <span class="sun-item__label">Sunrise</span>
              <span id="current-sunrise" class="sun-item__value"></span>
            </div>
            <div class="sun-item">
              <span class="sun-item__label">Sunset</span>
              <span id="current-sunset" class="sun-item__value"></span>
            </div>
          </div>
        </div>
      </section>

      <section id="view-five-day" class="view hidden">
        <div id="five-day-grid" class="forecast-grid"></div>
      </section>

      <section id="view-thirty-day" class="view hidden">
        <div id="thirty-day-info" class="info-banner">
          <p></p>
        </div>
        <div id="thirty-day-grid" class="forecast-grid forecast-grid--compact"></div>
      </section>
    </main>

    <footer class="footer">
      <p>Data provided by <span id="source-attribution">Open-Meteo</span> &middot; Simply Weather</p>
    </footer>
  </div>

  <script src="js/sources/open-meteo.js"></script>
  <script src="js/sources/met-norway.js"></script>
  <script src="js/sources/nws.js"></script>
  <script src="js/sources/smhi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
